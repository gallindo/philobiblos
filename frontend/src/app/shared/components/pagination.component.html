<div class="pagination">
  <span class="info">
    {{ start }}–{{ end }} of {{ totalCount() }}
  </span>
  <div class="controls">
    <button
      type="button"
      (click)="goToPage(page() - 1)"
      [disabled]="page() <= 1"
    >
      Previous
    </button>
    <span class="page-number">Page {{ page() }} of {{ totalPages }}</span>
    <button
      type="button"
      (click)="goToPage(page() + 1)"
      [disabled]="page() >= totalPages"
    >
      Next
    </button>
  </div>
</div>
