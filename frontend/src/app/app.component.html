<div class="app">
  <header class="app-header">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">📚</span>
      <h1>{{ title }}</h1>
    </div>
    <nav class="main-nav" aria-label="Main sections" data-testid="main-nav">
      @for (section of sections; track section.path) {
        <a
          [routerLink]="section.path"
          routerLinkActive="active"
          [attr.data-testid]="'nav-' + section.path.substring(1)"
        >
          {{ section.label }}
        </a>
      }
    </nav>
    <div class="auth-nav" aria-label="Authentication" data-testid="auth-nav">
      @if (authService.isAuthenticated()) {
        <span data-testid="user-display">{{ authService.user()?.displayName ?? authService.user()?.email }}</span>
        <button type="button" (click)="authService.logout()" data-testid="logout-button">Logout</button>
      } @else {
        <a routerLink="/login" data-testid="login-link">Login</a>
      }
    </div>
  </header>

  @if (errorService.messageSignal()) {
    <div class="global-banner" role="alert" data-testid="error-banner">
      <span>{{ errorService.messageSignal() }}</span>
      <button type="button" (click)="errorService.clear()" aria-label="Dismiss" data-testid="error-dismiss">×</button>
    </div>
  }

  <main id="main" class="content">
    <router-outlet />
  </main>
</div>
